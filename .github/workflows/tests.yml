name: Tests

on:
  push:
    branches: [master, Version-amelioree]
  pull_request:
    branches: [master, Version-amelioree]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      QSI_DISABLE_C_ACCELERATION: "1"
      QSI_CONSENSUS_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        working-directory: stock-analysis-ui
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest ruff

      # Deux regles seulement, celles qui attrapent de vraies pannes :
      #   F821 nom indefini  -> NameError garanti a l'execution
      #   F811 redefinition  -> la premiere definition est masquee, donc morte
      # Volontairement pas de nettoyage de style ici : la CI doit signaler des
      # bugs, pas du bruit, sinon elle finit ignoree.
      - name: Lint (bugs only)
        working-directory: stock-analysis-ui
        run: ruff check --select=F821,F811,E9 --exclude=src/Archiv src/

      - name: Run safe test subset (no network, no real DB)
        working-directory: stock-analysis-ui
        run: pytest -m "not integration"
